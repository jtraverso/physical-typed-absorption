version: "v0.4"

project:
  name: "Triangle decompositions III: physical typed absorption and prescribed statistics"
  description: >-
    The Lean source supplement of Paper III of the Nash-Williams series (preprint 1.0), packaged
    with a Mathlib-only Challenge. Theorem T: for fixed labels I, allowed label multisets F and
    constants alpha > 0, C >= 1, h >= 6, every labelled graph of order at least n0 that has an
    exact diffuse fractional triangle seed of constant C (H1), whose edge indicator lies in the
    integer lattice spanned by its allowed triangles (H2), with at least alpha n common
    neighbours labelled k for every pair of distinct vertices and every label k completing an
    allowed type (H3), and at least alpha n^(i-4) physical hinges of some order
    6 <= i <= h for every pair of allowed triangles on a common edge (H4), has an allowed
    triangle decomposition. Theorem T+: for every eta > 0 and q the decomposition can moreover be
    chosen so that every family of at most n^q triangle tests bounded by 1, and the Pasch count,
    are within eta n^2 of their values under the seed. Applications: Latin squares following a
    bounded stochastic profile with prescribed statistics and Pasch count (Theorem 8.1), the
    uniform and signed rank-one profiles with their intercalate counts (Corollaries 8.2 and 8.3),
    two Latin squares each of which separately approximates, up to eps m^2, the same prescribed
    statistics and the same eight coarse-block targets (their own values need not coincide), with
    intercalate counts near different targets (Theorem 8.4, m divisible by four), and the balanced complete five-partite graph with parts
    of size 3|A| and rainbow triangles (Corollary 8.5). Seven statements. All thresholds are
    existential; the explicit tower bound of Section 7 is not compared.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

