name = "PhysicalTypedAbsorption"
version = "1.0.0"
requiresModuleSystem = true
defaultTargets = ["PaperIIIChallenge", "PaperIIISolution"]

# The archive was assembled with validated object reuse; a build from an empty cache exceeds the
# default heartbeat limit in some modules (e.g. CorePaidWindow, VortexReservedTerminalPartition).
# Raising the limit here keeps every source file byte-identical.
[leanOptions]
maxHeartbeats = 1600000

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "PartitionedTriangleAbsorption"
globs = ["PartitionedTriangleAbsorption.*"]

[[lean_lib]]
name = "PaperIIIChallenge"
roots = ["PaperIIIChallenge"]

[[lean_lib]]
name = "PaperIIISolution"
roots = ["PaperIIISolution"]
