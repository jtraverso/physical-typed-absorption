  reviewers: ["Claude Opus 5.5 (Anthropic), acting for the author"]
  notes: >-
    The Challenge definitions were copied verbatim from the source files with their options and
    open declarations, and the statements were checked against the manuscript. No independent
    human review of this formalization is claimed.

